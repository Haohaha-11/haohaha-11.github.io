# Homepage "Reflection" card: one reflective question, then the threads under it.
# Also feeds the "Current Learning" and "Other Projects" cards below it.
intro: >-
  Across projects I keep coming back to one question: what should a model keep
  from what it sees, and how should it get that back when it needs it? To me,
  this is a concrete way into a broader idea I keep thinking about:
  <span class="term term-key">compression is intelligence</span>.

threads:
  - tag: MLLM reasoning
    question: What should a reasoning model remember?
    text: >-
      The longer multimodal models reason, the less they look at the image.
      ReMAP analyzes visual memory along curation, organization, and access,
      then keeps compact latent memories that the model learns to recall when
      its reasoning needs them.
    links:
      - name: arXiv
        url: https://arxiv.org/abs/2610.05097
      - name: Code
        url: https://github.com/Haohaha-11/ReMAP
  - tag: AI for pathology
    question: What does a diagnosis need to see?
    text: >-
      A gigapixel slide is mostly redundant; its diagnostic evidence sits in a
      few patches. CKMIL keeps those key instances instead of letting global
      attention dilute them. My ongoing work on pathology image compression asks
      how much of a slide diagnosis actually needs, and finds that some
      morphological tasks do not depend on image reconstruction.
    links:
      - name: CKMIL
        url: https://haoceanlab.cn/pdfs/ckmil-aaai-26.pdf
  - tag: Along the way
    question: MLLM safety
    text: >-
      I also worked on jailbreak attacks against vision-language models: PIS
      builds scenario-grounded typographic prompts with cooperating agents, and
      StructAttack shows that a model's own compositional reasoning can
      reassemble a harmful request split into benign pieces.
    links:
      - name: PIS
        url: https://haoceanlab.cn/pdfs/persuasion-in-scene-cvpr-2026.pdf
      - name: StructAttack
        url: https://arxiv.org/abs/2603.07590

# "Current Learning" card, shown right after Reflection.
current_learning:
  - name: World models and spatial memory
    text: >-
      At Peking University, I joined the memory world model and spatial memory
      projects, carrying the question above over to world models.
  - name: AI infrastructure
    text: >-
      Learning the systems that large-model training and inference run on.
  - name: Compression is intelligence
    text: >-
      Continuing to study and think about this thesis, the idea behind the
      reflection above.

# Shorter projects listed in the "Other Projects" card (no venues or status).
other:
  - name: SPLIT
    topic: Long-context test-time training
    text: >-
      Writing context into weights and reading evidence back behave as two
      different capabilities that live in different layers; SPLIT trains them
      through separate pathways.
  - name: GAPs
    topic: Blind diffusion posterior sampling
    text: >-
      Passing simulation-based calibration does not mean a sampler recovered the
      parameters: in high dimensions, a calibrated noise-scale posterior can
      carry almost no information, which is recoverable through the conditional
      posterior covariance.
  - name: QWan
    topic: World–action models for robotics
    text: >-
      Learning actionable world representations from off-expert robot
      trajectories: off-expert data supervises future-video prediction but not
      the policy's actions.
  - name: SpikeMem
    topic: Agent memory
    text: >-
      An agent memory built from spiking-circuit motifs (coincidence gating,
      conduction delays, winner-take-all inhibition) that picks the current
      version of changing facts in multi-hop question answering.
