# Homepage "Reflection" card: one paragraph on how my view of compression grew
# (abstraction → selection → utilization → intelligence).
# Also feeds the "Current Learning" and "Other Projects" cards below it.
reflection: >-
  Looking back, my projects keep circling one question: what should a model keep
  from what it sees, and how should it get that back when it needs it? I see this
  as a concrete handle on <span class="term term-key">compression is intelligence</span>.
  In my first year, I learned the basics of image processing, and watching
  <span class="term">convolutional networks</span> turn images, layer by layer,
  into <span class="term">abstract features</span> made me realize for the first
  time that neural networks are, at heart, a form of compression. I then studied
  pathology image analysis and compression with
  <a href="https://liangjiandeng.github.io/" target="_blank">Prof. Liang-Jian Deng</a>,
  where <span class="term">attention mechanisms</span> showed me that compression
  is not only about making information smaller but about deciding what to keep,
  lifting my understanding of compression to the level of
  <span class="term">selection</span>. Working on
  <span class="term">thinking with latent visual memory</span>, I had to select
  effectively, compress effectively, and use the compressed memory effectively at
  the same time, which took my sense of compression a step further. Recently I
  joined the <span class="term">spatial memory</span> and
  <span class="term">memory world model</span> (AI infra) projects. Studying
  <span class="term">abstract cognitive maps</span> in cognitive science gave me a
  new understanding of compression in <span class="term">biological intelligence</span>,
  and on the AI infrastructure side, <span class="term">Kimi K3's KDA</span>
  (Kimi Delta Attention) compresses an ever-growing context into a
  <span class="term">fixed-size linear state</span>, while
  <span class="term">DeepSeek</span> compresses at the level of attention, the KV
  cache, and layers at once. All of this made me feel more deeply that
  <span class="term term-key">compression is intelligence</span>. It shows me a
  <span class="term">path beyond scale</span>: not only making models bigger, but
  teaching them to compress better. I like this view, and I want to keep exploring
  and learning along it.

