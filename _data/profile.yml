short_bio: >-
  I am a third-year undergraduate in Fundamental Science of Mathematics and Physics (AI) at
  <a href="https://en.uestc.edu.cn/" target="_blank">UESTC</a>, Yingcai Honors College. I began by learning <span class="term">computational pathology</span> and
  <span class="term">image compression</span> with
  <a href="https://liangjiandeng.github.io/" target="_blank">Prof. Liang-Jian Deng</a>, where
  <span class="term">AI for medicine</span> first gave me a feel for the idea that
  <span class="term term-key">compression is intelligence</span>. I then became a research intern with
  <a href="https://cs.pku.edu.cn/info/1233/2060.htm" target="_blank">Prof. Shanghang Zhang</a> at
  Peking University, learning <span class="term">multimodal large language models</span> and studying
  <span class="term">thinking with latent visual memory</span>, which deepened my understanding of how
  memory, a product of compression, is formed, what form it takes, and how it is accessed. Now I
  continue to learn about <span class="term">memory for world models</span> and
  <span class="term">spatial memory</span>, and keep exploring the thesis that
  <span class="term term-key">compression is intelligence</span> through world models and
  <span class="term">AI infrastructure</span>.

