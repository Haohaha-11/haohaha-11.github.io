short_bio: >-
  I am a third-year undergraduate in Fundamental Science of Mathematics and Physics (AI) at UESTC,
  Yingcai Honors College. In my sophomore year, I studied image processing with Prof. Liangjian Deng
  and worked on computational pathology and image compression. I later moved toward large language
  models, exploring LLM test-time learning and multimodal latent memory. I am currently a research
  intern with Prof. Shanghang Zhang at Peking University, studying world-model memory and spatial memory.

