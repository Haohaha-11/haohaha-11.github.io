{{- $url := .Get "url" -}}
{{- $height := .Get "height" | default "600px" -}}

<div class="pdf-container" style="margin: 2rem 0;">
  <div class="pdf-viewer" style="position: relative; width: 100%; height: {{ $height }}; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
    <embed src="{{ $url }}" 
           type="application/pdf" 
           width="100%" 
           height="100%"
           style="border: none;">
    <!-- 备用方案：如果 embed 不工作，使用 iframe -->
    <noscript>
      <iframe src="{{ $url }}" 
              width="100%" 
              height="100%" 
              style="border: none;">
      </iframe>
    </noscript>
  </div>
  <div class="pdf-download" style="margin-top: 1rem; text-align: center;">
    <a href="{{ $url }}" 
       download 
       class="pdf-download-btn"
       style="display: inline-block; padding: 0.5rem 1.5rem; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; transition: background-color 0.3s;">
      📥 下载 PDF
    </a>
  </div>
</div>

<style>
  .pdf-container {
    max-width: 100%;
  }
  
  @media (max-width: 768px) {
    .pdf-viewer {
      height: 400px !important;
    }
  }
  
  .pdf-download-btn:hover {
    background-color: #0056b3;
  }
</style>
