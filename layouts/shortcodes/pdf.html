{{- $url := .Get "url" -}}
{{- $height := .Get "height" | default "600px" -}}

<div class="pdf-container" style="--pdf-height: {{ $height }};">
  <div class="pdf-viewer">
    <embed
      src="{{ $url }}"
      type="application/pdf"
      width="100%"
      height="100%"
      class="pdf-viewer__frame">
    <noscript>
      <iframe
        src="{{ $url }}"
        width="100%"
        height="100%"
        class="pdf-viewer__frame"
        title="PDF viewer">
      </iframe>
    </noscript>
  </div>
  <div class="pdf-download">
    <a href="{{ $url }}" download class="pdf-download-btn">
      下载 PDF
    </a>
  </div>
</div>
