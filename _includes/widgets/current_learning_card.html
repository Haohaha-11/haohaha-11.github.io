<div class="my-3 bg-white shadow-sm rounded-sm">
    <h6 class="p-3 mb-0 border-bottom border-gray"><i class="fas fa-book-open"></i> Current Learning</h6>
    <ul class="current-learning mb-0">
        {% for item in site.data.research.current_learning %}
        <li>
            <span class="learning-topic">{{ item.name }}</span>
            {% if item.note %}<span class="text-muted"> · {{ item.note }}</span>{% endif %}
        </li>
        {% endfor %}
    </ul>
</div>
