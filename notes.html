---
layout: default
title: Notes
navbar_name: Notes
---
<div class="row">
  <div class="col-12 col-lg-10">
    <h2 class="pt-4"><i class="fas fa-book"></i> Notes</h2>
    <div class="my-0 p-0 bg-white shadow-sm rounded-sm">
      {% assign notes = site.notes | sort: "date" | reverse %}
      {% for note in notes %}
      <div class="p-3 border-bottom border-gray">
        <a href="{{ note.url | relative_url }}"><h5 class="my-1">{{ note.title }}</h5></a>
        <p class="small text-muted my-1">{{ note.date | date: "%B %d, %Y" }}</p>
        {% if note.summary %}<p class="my-1">{{ note.summary }}</p>{% endif %}
      </div>
      {% endfor %}
    </div>
  </div>
</div>
